<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<title>비번 모음</title>
<style>
    body {
        font-family: 'Segoe UI', -apple-system, BlinkMacSystemFont, Roboto, sans-serif;
        background: #f0f4f8;
        color: #1e293b;
        display: flex;
        justify-content: center;
        align-items: center;
        height: 100vh;
        margin: 0;
    }

    .container {
        text-align: center;
        max-width: 600px;
        width: 95%;
    }

    /* 퀴즈 박스 스타일 - 밝은 톤 테마 */
    .quiz-box {
        background: #ffffff;
        padding: 35px;
        border-radius: 16px;
        box-shadow: 0 10px 25px rgba(15, 23, 42, 0.08);
        max-height: 80vh;
        display: flex;
        flex-direction: column;
        transition: all 0.3s ease;
    }

    /* 정답 처리 시 애니메이션 효과 */
    .quiz-box.success-anim {
        animation: success-pop 0.5s ease-out forwards;
        border: 2px solid #22c55e;
    }

    @keyframes success-pop {
        0% { transform: scale(1); }
        50% { transform: scale(1.03); box-shadow: 0 10px 30px rgba(34, 197, 94, 0.2); }
        100% { transform: scale(1); }
    }

    .quiz-header {
        font-size: 14px;
        font-weight: 600;
        color: #64748b;
        margin-bottom: 15px;
        flex-shrink: 0;
    }

    /* 질문 영역: 스크롤바 커스텀 */
    .quiz-question {
        font-size: 17px;
        font-weight: 500;
        line-height: 1.6;
        color: #334155;
        margin-bottom: 25px;
        word-break: break-all;
        overflow-y: auto;
        padding-right: 5px;
        text-align: left;
    }

    .quiz-question::-webkit-scrollbar {
        width: 6px;
    }
    .quiz-question::-webkit-scrollbar-thumb {
        background: #cbd5e1;
        border-radius: 4px;
    }

    /* 복사방지 스타일 */
    .no-select {
        -webkit-user-select: none;
        -moz-user-select: none;
        -ms-user-select: none;
        user-select: none;
    }

    .quiz-num {
        cursor: pointer;
        display: inline-block;
        font-weight: bold;
        color: #3b82f6;
    }

    .input-wrapper {
        flex-shrink: 0;
    }

    input {
        padding: 14px;
        font-size: 16px;
        border-radius: 10px;
        border: 2px solid #e2e8f0;
        width: 80%;
        text-align: center;
        background: #f8fafc;
        color: #1e293b;
        margin-bottom: 10px;
        outline: none;
        transition: border-color 0.2s;
    }

    input:focus {
        border-color: #3b82f6;
        background: #ffffff;
    }

    .feedback {
        height: 20px;
        font-size: 14px;
        font-weight: 600;
        color: #ef4444;
        margin-bottom: 15px;
    }

    .submit-btn {
        padding: 14px 32px;
        border-radius: 10px;
        border: none;
        background: #3b82f6;
        color: white;
        font-size: 16px;
        font-weight: 600;
        cursor: pointer;
        transition: background 0.2s, transform 0.1s;
        box-shadow: 0 4px 6px rgba(59, 130, 246, 0.2);
    }

    .submit-btn:hover {
        background: #2563eb;
    }
    
    .submit-btn:active {
        transform: scale(0.98);
    }

    .buttons {
        display: none;
        margin-top: 20px;
    }

    .copy-btn {
        display: block;
        margin: 12px auto;
        padding: 14px;
        width: 260px;
        border-radius: 12px;
        border: none;
        background: linear-gradient(135deg, #10b981, #3b82f6);
        color: white;
        font-size: 16px;
        font-weight: 600;
        cursor: pointer;
        transition: transform 0.2s, box-shadow 0.2s;
        box-shadow: 0 4px 12px rgba(59, 130, 246, 0.15);
    }

    .copy-btn:hover {
        transform: scale(1.03);
        box-shadow: 0 6px 16px rgba(59, 130, 246, 0.25);
    }
</style>
</head>
<body>

<div class="container">

        <div class="input-wrapper">
            <input type="text" id="answerInput" placeholder="정답 입력" autocomplete="off">
            <div class="feedback" id="feedbackText"></div>

<script>

    { label: "신유수68 이메일 비번", text: "JHhTafk4frpZ4U07" }

// 8번 문제 전용 기회 제한 변수 (한 번 결과가 정해지면 고정됨)
let dunhillResultLocked = null; 

// 원본 퀴즈 데이터 목록
const rawQuizData = [
    { id: 1, q: "본 계정주가 가장 유일무이하게 편하게 대하며 가장 먼저 친해진 2학년 선배의 학번은?", check: (val) => val === "20211211" },
    { id: 2, q: "본 계정주가 가장 편하다고 느끼며 자신의 모든 비밀과 고민을 망설임 없이 털어놓을 수 있을것 같다고 생각하는 사람의 <b>거주지역 지역번호, 생년월일 8자리, 출신 고등학교의 전화번호 뒷자리</b>를 모두 더한 값은?", check: (val) => val === "20072406" },
    { id: 3, q: "본 계정주가 에타에서 두번째로 인연을 만든 영미과 학부생의 인스타 아이디는?", check: (val) => val === "wo0o_06" || val === "7ool_c" },
    { id: 4, q: "본 계정주의 드림카 제조사는?", check: (val) => {

        if (val === "벤츠" || val === "benz") return { success: false, msg: "풀네임으로." };
        if (val === "Mercedes-Benz" || val === "메르세데스-벤츠" || val === "BMW") return { success: false, msg: "자회사가 아님" };
        if (val === "bmw") return { success: false, msg: "대문자가 아님" };

    }},
    { id: 5, q: "본 계정주가 고친 신체부위는?", check: (val) => {

    }},
    { id: 6, q: "본 계정주가 고칠 예정인 신체부위는?", check: (val) => {
        if (val === "Nose wing") return { success: true };
        if (/^[가-힣\s]+$/.test(val)) return { success: false, msg: "영문으로 표기" };
        return { success: false };
    }},
    { id: 7, q: "본 계정주가 가장 좋아하는 배우의 소속사에 속한 연예인은?", check: (val) => ["강길우","권다함","김민하","김보라","김소혜","김슬기","김정우","김주령","박소진","박정연","성유빈","심수빈","오승훈","우지현","유의태","윤경호","윤병희","이레","이민지","이상희","이석형","이유지","이은샘","임세미","장선","전배수","정유미","조한철"].includes(val) },
    { id: 8, q: "본 계정주의 주력 담배 회사명은?", check: (val) => {
        // 이미 주사위가 굴려진 상태라면 그 결과를 그대로 리턴
        if (dunhillResultLocked !== null) {
            return dunhillResultLocked;
        }

        if (val === "던힐") {
            const isSuccess = Math.random() < 0.20; // 20% 확률
            dunhillResultLocked = isSuccess; // 첫 실행 결과를 락(Lock) 걸어둠
            return isSuccess;
        }
        if (val === "DUNHILL") {
            const isSuccess = Math.random() < 1.00; // 100% 확률
            dunhillResultLocked = isSuccess; // 첫 실행 결과를 락(Lock) 걸어둠
            return isSuccess;
        }
        return false;
    }},
    { id: 9, q: "본 계정주의 노래방 2번 애창곡의 노래방 번호 2개(TJ와 금영)를 곱한 값은?", check: (val) => val === "1013680572" },
    { id: 10, q: "본 계정주가 가장 편하다고 느끼며 자신의 모든 비밀과 고민을 망설임 없이 털어놓을 수 있을것 같다고 생각하는 사람의 주력담배 회사의 제조국은?", check: (val) => {
        if (val === "United States of America") return { success: true };
        if (/^[가-힣\s]+$/.test(val)) return { success: false, msg: "영문으로 표기" };
        return { success: false };
    }},
    { id: 11, q: "본 계정주의 인생영화의 개봉일은?", check: (val) => {
        if (["2003년 1월 30일", "2003년1월30일", "2003년 1월30일"].includes(val)) return { success: true };
        if (["2024년 7월 3일", "2024년7월3일", "2024년 7월3일"].includes(val)) return { success: false, msg: "재개봉일이 아님" };
        return { success: false };
    }},
    { id: 12, q: "본 계정주가 가장 좋아하는 가수의 생일과 장안대학교 설립 날짜(년도와 월), 소속사(2026.06 기준)의 소재지 우편번호를 모두 합한 값은?", check: (val) => val === "201770" },
    { id: 13, q: "국내에서 가장 유명하고 판매량이 높은 담배 제조사의 대표전화 번호의 가운데 숫자와 종목코드를 더한 뒤 3을 곱한 값은?", check: (val) => val === "69422" },
    { id: 14, q: "어떤 자연수 (n)에 대하여, 길이가 (n)인 수열 ((a_1, a_2, \\dots, a_n))이 주어져 있으며 이 수열은 다음 조건들을 모두 만족한다고 가정한다: 먼저 모든 항은 정수이며 (1 \\le a_i \\le 10^6)을 만족하고, 동시에 임의의 서로 다른 두 인덱스 (i, j)에 대하여 (a_i - a_j)는 항상 7의 배수이거나 11의 배수이거나 또는 그 둘의 곱인 77의 배수 중 하나로 표현될 수 있다(즉 차이는 항상 (7k), (11k), 또는 (77k) 꼴의 정수로 나타난다), 또한 이 수열은 다음의 재귀적 조건을 만족하는데 모든 (k \\ge 3)에 대해 (a_k = a_{k-1} + a_{k-2} - a_{k-3} + d_k) 형태를 가지며 여기서 (d_k)는 (k)에 따라 변하는 보정항으로서 (d_k \\in {-2, -1, 0, 1, 2}) 중 하나이며 추가로 (d_k)는 다음 조건을 따른다: (k)를 5로 나눈 나머지가 0이면 (d_k \\ge 0), 1이면 (d_k \\le 0), 2이면 (d_k)는 홀수, 3이면 (d_k)는 짝수, 4이면 (d_k \\neq 0)이다; 또한 초기값 (a_1, a_2, a_3)는 모두 서로 다르고, (a_1 + a_2 + a_3 = 2026)을 만족하며, (a_2 - a_1 = 77t)인 어떤 정수 (t)가 존재하고, (a_3 - a_2 = 7s)인 정수 (s)가 존재한다는 조건이 주어진다.<br>추가로 이 수열은 다음과 같은 “부분 합 안정성 조건”을 만족하는데, 임의의 (k \\ge 4)에 대해 구간합 (S_k = a_1 + a_2 + \\cdots + a_k)는 항상 어떤 정수 (m_k)에 대하여 (S_k \\equiv m_k \\pmod{13})을 만족하면서 동시에 (m_k)는 (k^2 - k + 1)의 약수 중 하나여야 한다는 제한이 있으며, 이때 (m_k)는 항상 양의 정수이다.<br>또한 이 수열은 “국소 균형 조건”을 만족하는데, 임의의 연속한 세 항에 대해 ((a_i, a_{i+1}, a_{i+2}))의 평균은 항상 정수이며 그 정수는 (a_{i+3})보다 크지 않다. 동시에 모든 (i \\ge 2)에 대해 (a_i \\cdot a_{i-1} + a_{i+1})은 3으로 나누어 떨어진다.<br>이제 이 수열에 대해 다음과 같은 변환을 정의한다: 새로운 수열 ((b_1, b_2, \\dots, b_n))를 (b_i = a_i^2 - a_{i-1}a_{i+1}) (단 (2 \\le i \le n-1))로 정의하고, 경계값은 (b_1 = a_1^2 - a_2), (b_n = a_n^2 - a_{n-1})로 둔다. 이때 ((b_i))는 다음 성질을 만족해야 한다: 모든 (b_i)는 5로 나눈 나머지가 1 또는 4이며, 동시에 (b_i)의 최대값과 최소값의 차이는 2026 이하이다.<br>여기서 추가로 다음 조건이 더 주어진다: 수열 (a_i) 중 홀수 번째 항들의 합은 짝수 번째 항들의 합보다 77만큼 크며, 또한 홀수 인덱스 항들 중 7의 배수인 값의 개수는 짝수 인덱스 항들 중 11의 배수인 값의 개수와 같다.<br>또한 어떤 함수 (f(x) = ax^2 + bx + c)가 존재하여 모든 (i)에 대해 (a_i = f(i) \\mod 1000)을 만족하며, 동시에 계수 (a,b,c)는 모두 정수이고 (|a| + |b| + |c| \\le 50)을 만족한다.<br>마지막으로 전체 수열은 “회전 대칭성”을 갖는데, 즉 어떤 정수 (r)이 존재하여 모든 (i)에 대해 (a_i = a_{(i+r) \\bmod n})이 성립한다.<br>이 모든 조건을 동시에 만족하는 수열이 존재한다고 할 때, 가능한 최소의 (n)과  (a_1)의 값, 전체 합 (S_n), (b_i)의 최댓값, 수열이 만족할 수 있는 서로 다른 (d_k)의 전체 가능한 개수를 모두 곱한 값을 구해줘.", check: (val) => val === "0", noSelect: true },
    { id: 15, q: "비밀번호", check: (val) => val === "ss00686848ss" }
];

let finalQuizList = [];
let currentIdx = 0;

// 커스텀 마스터키 시퀀스 추적 변수들
let clickCount = 0;
let isClickPhaseDone = false;
let keySequence = []; 
let isMasterKeyActivated = false; // 마스터키 활성화 완료 상태 저장 변수

function setupQuizzes() {
    const pool = rawQuizData.filter(q => q.id !== 14 && q.id !== 15);
    for (let i = pool.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [pool[i], pool[j]] = [pool[j], pool[i]];
    }
    const q14 = rawQuizData.find(q => q.id === 14);
    const q15 = rawQuizData.find(q => q.id === 15);
    finalQuizList = [...pool, q14, q15];
}

const quizBox = document.getElementById('quizBox');
const progress = document.getElementById('quizProgress');
const questionEl = document.getElementById('quizQuestion');
const answerInput = document.getElementById('answerInput');
const feedbackText = document.getElementById('feedbackText');
const submitBtn = document.getElementById('submitBtn');
const container = document.getElementById('buttonContainer');

function renderQuiz() {
    if (currentIdx >= finalQuizList.length) {
        unlockSecrets();
        return;
    }

    feedbackText.textContent = "";
    answerInput.value = "";
    progress.textContent = `문제 ${currentIdx + 1} / ${finalQuizList.length}`;
    
    const currentQuiz = finalQuizList[currentIdx];
    const displayNum = currentIdx + 1;
    
    // 복사 방지 유무 설정
    if(currentQuiz.noSelect) {
        questionEl.className = "quiz-question no-select";
    } else {
        questionEl.className = "quiz-question";
    }
    
    // 입력창 형태 정의 기준 처리
    if (currentIdx === finalQuizList.length - 1) {
        answerInput.type = "password";
    } else if (currentIdx === 0 && isMasterKeyActivated) {
        answerInput.type = "password";
    } else {
        answerInput.type = "text";
    }
    
    // 첫번째 문제일 때 마스터키 이스터에그 세팅
    if (currentIdx === 0) {
        questionEl.innerHTML = `<span class="quiz-num" id="numTrigger">${displayNum}.</span> ${currentQuiz.q}`;
        
        if(!isMasterKeyActivated) {
            clickCount = 0;
            isClickPhaseDone = false;
            keySequence = [];
        } else {
            feedbackText.style.color = "#22c55e";
            feedbackText.textContent = "마스터키 입력 활성화됨.";
        }

        document.getElementById('numTrigger').addEventListener('click', () => {
            if (isClickPhaseDone || isMasterKeyActivated) return;
            clickCount++;
            if(clickCount === 4) {
                isClickPhaseDone = true;
                feedbackText.style.color = "#3b82f6";
                feedbackText.textContent = "[인증 진행 중...] 키 입력을 계속하세요.";
            }
        });
    } else {
        questionEl.innerHTML = `${displayNum}. ${currentQuiz.q}`;
    }
    answerInput.focus();
}

// 첫번째 문제에서 커스텀 커맨드(스페이스 2번 -> 엔터 2번) 감지 처리
window.addEventListener('keydown', (e) => {
    if (currentIdx !== 0 || !isClickPhaseDone || isMasterKeyActivated) return;

    if (e.key === ' ' || e.key === 'Spacebar') {
        e.preventDefault(); 
        keySequence.push('Space');
        checkSequence();
    } else if (e.key === 'Enter') {
        keySequence.push('Enter');
        if (checkSequence()) {
            e.preventDefault(); 
        }
    }
});

function checkSequence() {
    const targetSeq = ['Space', 'Space', 'Enter', 'Enter'];
    
    if (keySequence.length > targetSeq.length) {
        keySequence.shift();
    }
    
    if (JSON.stringify(keySequence) === JSON.stringify(targetSeq)) {
        isMasterKeyActivated = true; 
        feedbackText.style.color = "#22c55e";
        feedbackText.textContent = "마스터키 입력 활성화됨.";
        answerInput.type = "password"; 
        answerInput.focus();
        return true;
    }
    return false;
}

function showFail(msg) {
    feedbackText.style.color = "#ef4444";
    feedbackText.textContent = msg || "틀렸습니다. 다시 시도해보세요.";
}

// 다음 퀴즈로 진행하며 정답 애니메이션을 보여주는 함수
function handleSuccess() {
    feedbackText.style.color = "#22c55e";
    feedbackText.textContent = "정답입니다!";
    quizBox.classList.add('success-anim');

    // 애니메이션이 끝난 후(0.5초) 다음 문제 렌더링
    setTimeout(() => {
        quizBox.classList.remove('success-anim');
        currentIdx++;
        renderQuiz();
    }, 500);
}

submitBtn.onclick = () => {
    const val = answerInput.value.trim();
    const currentQuiz = finalQuizList[currentIdx];
    
    // 첫번째 문제 마스터키 적용 처리
    if (currentIdx === 0 && isMasterKeyActivated && val === "masterkey") {
        feedbackText.style.color = "#22c55e";
        feedbackText.textContent = "마스터키 확인 완료.";
        quizBox.classList.add('success-anim');
        setTimeout(() => {
            quizBox.classList.remove('success-anim');
            currentIdx = finalQuizList.length - 1; 
            renderQuiz();
        }, 500);
        return;
    }

    const res = currentQuiz.check(val);
    
    if (typeof res === 'object') {
        if (res.success) {
            handleSuccess();
        } else {
            showFail(res.msg);
        }
    } else {
        if (res === true) {
            handleSuccess();
        } else {
            showFail();
        }
    }
};

answerInput.addEventListener('keyup', (e) => {
    if (e.key === 'Enter') {
        if (currentIdx === 0 && isMasterKeyActivated) {
            return; 
        }
        submitBtn.click();
    }
});

function unlockSecrets() {
    quizBox.remove();
    container.style.display = 'block';

    buttonData.forEach((item) => {
        const btn = document.createElement('button');
        btn.className = 'copy-btn';
        btn.textContent = item.label;

        btn.onclick = () => {
            navigator.clipboard.writeText(item.text);
            btn.textContent = "복사됨!";
            setTimeout(() => {
                btn.textContent = item.label;
            }, 1000);
        };

        container.appendChild(btn);
    });
}

setupQuizzes();
renderQuiz();
</script>
